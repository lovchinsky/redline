name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, boundaries, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DOM packages are tested in a real Chromium (Vitest browser mode).
      - run: pnpm --filter @redline/dom exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:boundaries:selftest
      - run: pnpm depcruise
      - run: pnpm depcruise:selftest
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Extension e2e
    runs-on: ubuntu-latest
    needs: check
    services:
      # A real Postgres for the receiver: tests make and drop their own databases on it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redline
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REDLINE_TEST_DATABASE_URL: postgres://redline@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @redline/extension exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Scripts injected into users' pages stay within their size budgets.
      - run: pnpm budgets
      # The production build these tests ran on, packed as is: it is what gets published.
      - run: node scripts/pack-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: apps/extension/.output/redline-*-chrome.zip
          # `.output` is a hidden directory: without this the zip is silently left out.
          include-hidden-files: true
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/extension/test-results

  receiver:
    name: Receiver integration
    runs-on: ubuntu-latest
    needs: check
    services:
      # A real Postgres for the receiver: tests make and drop their own databases on it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redline
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REDLINE_TEST_DATABASE_URL: postgres://redline@localhost:5432/postgres
      # The runner tests run sandboxes on the runner's Docker Engine, under runc.
      REDLINE_TEST_DOCKER: /var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Storage, the job queue in one transaction, and the contract the extension relies on.
      - run: pnpm test:integration
      # The images the deployment builds (apps/receiver/deploy/compose.yaml).
      - run: docker build -f apps/receiver/Dockerfile -t redline-receiver .
      - run: docker build -f apps/agent-host/Dockerfile -t redline-agent .
      # agent-host starts in its image and fails only for want of a grant: the bundle and the
      # Agent SDK it loads are in place.
      - run: |
          docker run --rm --entrypoint node redline-agent /opt/agent-host/dist/agent-host.mjs 2>&1 \
            | grep -q 'No grant'

  eval:
    name: Anchor quality (tools/eval)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @redline/eval exec playwright install --with-deps chromium
      # Fails below the target share of cases; the report shows every case and its anchors.
      - run: pnpm eval
      - if: always()
        run: cat tools/eval/.output/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-quality
          path: tools/eval/.output/report.md

  package:
    name: Chrome Web Store package
    runs-on: ubuntu-latest
    needs: [e2e, eval, receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Promotes the build e2e tested, never a new one, once the anchors pass too.
      - uses: actions/download-artifact@v4
        with:
          name: tested-build
          path: apps/extension/.output
      - run: node scripts/verify-store-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store
          path: apps/extension/.output/redline-*-chrome.zip
          # `.output` is a hidden directory: without this the zip is silently left out.
          include-hidden-files: true
          if-no-files-found: error
