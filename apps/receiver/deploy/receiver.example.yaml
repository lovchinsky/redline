# The receiver's configuration. Copy to receiver.yaml next to compose.yaml and adjust.

# The agent: Claude Code in a Docker sandbox per run, isolated by gVisor. The networks and the
# gateway's addresses are the ones compose.yaml creates. `kind: scripted` instead runs the
# whole flow without a model or sandboxes, for trying the receiver out.
agent:
  kind: claude
  networks: { setup: redline-sandbox-setup, agent: redline-sandbox-agent }
  gateway: { model: 'http://10.89.1.2:8788', egress: 'http://10.89.2.2:3128' }
  limits: { cpus: 2, memoryMegabytes: 4096, pids: 1024 }
  setupTimeoutMinutes: 15

# The git host. `local` works on repositories by path under `root` (REDLINE_GIT_ROOT, mounted
# into the worker): a change is pushed there as the branch `redline/<task>`, and its change
# request is simulated at `resultBaseUrl`.
git: { kind: local, root: /srv/git, resultBaseUrl: 'https://git.example/acme/web/pull/' }
# GitHub instead: a GitHub App (contents and pull requests: write; no workflows), or a bot's
# fine-grained token. Changes are scanned by gitleaks before anything is pushed; a project
# publishes to a branch of the repository itself, or with `publishing: { target: fork }` to the
# bot's fork (`git.fork`). Repositories are then `{ host: github, name: owner/repo }`.
# git:
#   kind: github
#   auth: { app: { id: 123456, privateKeyFile: /run/secrets/github-app.pem } }
#   fork: { owner: acme-redline-bot }
#   commitAs: { name: 'acme-redline[bot]', email: '123456+acme-redline[bot]@users.noreply.github.com' }

# Whose model credential tasks run with: managed (the operator's), required (each requester
# brings their own with every request), optional (theirs when given, the operator's otherwise).
models:
  credentials: managed
  # The operator's credential, read only by the gateway: an API key, or a subscription token
  # (`claude setup-token`) in a deployment of one person. Not needed with `required`.
  operator: { kind: api-key, secretFile: /run/secrets/anthropic-api-key }

intake: { bundleMegabytes: 50, files: 500, submissionsPerMinute: 30 }
worker: { runSlots: 2, runsPerProject: 1 }

defaults:
  policy: { maxQuestions: 3, replyTimeoutHours: 168, onReplyTimeout: proceed }
  # The sandbox image (built from apps/agent-host/Dockerfile, or a project's image FROM it),
  # the model, and the task's limits: dollars with an API key, tokens with a subscription.
  execution:
    image: redline-agent
    model: claude-opus-5-5
    maxTurns: 200
    timeoutMinutes: 45
    budgetUsd: 10
    budgetTokens: 10000000
    setupHosts: [registry.npmjs.org]
    # Secrets of private registries, by name: files the worker reads, which the project's setup
    # finds as $REDLINE_SECRETS/<name> (e.g. `NPM_TOKEN=$(cat $REDLINE_SECRETS/npm) pnpm install`).
    # They are mounted in the setup only, and its registry grant ends with it. The setup writes
    # the workspace the agent then works in: an install that writes a token into it (an .npmrc
    # with the token in it) hands the token to the agent. Use install commands that read it
    # from the environment.
    # setupSecrets: { npm: /run/secrets/npm-token }

projects:
  - id: acme-web
    name: Acme Web
    access: everyone
    repository: { host: local, name: acme/web.git, baseBranch: main }
    publishing: { target: branch, draft: true }
